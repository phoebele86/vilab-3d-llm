# VPS stage only: locally, Ollama is installed directly on the laptop.
services:
  ollama:
    image: ollama/ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - vilab
    restart: unless-stopped

volumes:
  ollama:

networks:
  vilab:
    external: true
